
name: Actualización automática SIPSA

on:
  schedule:
    # Todos los días a las 7:00 a. m. Colombia (12:00 UTC)
    - cron: '0 12 * * *'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sipsa-import
  cancel-in-progress: false

jobs:
  import:
    diagnose-windows:
    name: Diagnosticar DANE desde Windows
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Probar conexion HTTPS con DANE
        shell: pwsh
        run: |
          Write-Host "Probando acceso al WSDL desde Windows..."

          curl.exe -L -v `
            --connect-timeout 30 `
            --max-time 60 `
            "https://appweb.dane.gov.co/sipsaWS/SrvSipsaUpraBeanService?WSDL" `
            -o NUL

          Write-Host "Prueba finalizada."
    name: Importar precios del DANE
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      APP_ENV: production
      APP_KEY: ${{ secrets.APP_KEY }}

      DB_CONNECTION: mysql
      DB_HOST: ${{ secrets.TIDB_HOST }}
      DB_PORT: '4000'
      DB_DATABASE: ${{ secrets.TIDB_DATABASE }}
      DB_USERNAME: ${{ secrets.TIDB_USERNAME }}
      DB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}

      # Certificados raíz del sistema Ubuntu
      MYSQL_ATTR_SSL_CA: /etc/ssl/certs/ca-certificates.crt

    steps:
      # 1. Descargar repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar PHP
      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, xmlreader, curl, pdo_mysql, fileinfo
          coverage: none

      # 3. Instalar dependencias
      - name: Instalar dependencias Laravel
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --no-dev \
            --optimize-autoloader

      # 4. Verificar conexión con TiDB
      - name: Verificar conexión con TiDB
        run: php artisan db:show --database=mysql

      # 5. Diagnosticar conexión HTTPS normal con DANE
      - name: Diagnosticar conexion HTTPS con DANE
        continue-on-error: true
        run: |
          echo "Probando acceso al WSDL..."

          curl -v \
            --http1.1 \
            --connect-timeout 30 \
            --max-time 60 \
            "https://appweb.dane.gov.co/sipsaWS/SrvSipsaUpraBeanService?WSDL" \
            -o /tmp/sipsa.wsdl

          echo "Comprobando archivo WSDL..."
          ls -lh /tmp/sipsa.wsdl || true

      # 6. Diagnosticar conexión TLS 1.2
      - name: Probar conexion TLS 1.2 con DANE
        run: |
          echo "Probando TLS 1.2..."

          curl -v \
            --tlsv1.2 \
            --tls-max 1.2 \
            --http1.1 \
            --connect-timeout 30 \
            --max-time 60 \
            "https://appweb.dane.gov.co/sipsaWS/SrvSipsaUpraBeanService?WSDL" \
            -o /tmp/sipsa-tls12.wsdl

          echo "Comprobando resultado..."
          ls -lh /tmp/sipsa-tls12.wsdl

      # 7. Importación pausada durante el diagnóstico
      # Se habilitará cuando confirmemos la conexión con el DANE.
      #
      # - name: Importar datos SIPSA
      #   run: php artisan sipsa:import --download --days=400

      # 8. Limpiar caché de configuración
      - name: Limpiar caché de configuración
        if: always()
        run: php artisan config:clear || true